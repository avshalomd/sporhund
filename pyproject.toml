[project]
name = "sporhund"
version = "0.5.1"
description = "A FINN.no connector for your AI agent — search, inspect and track Norwegian marketplace listings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Avshalom Dayan" }]
keywords = ["finn", "finn.no", "mcp", "model-context-protocol", "marketplace", "norway", "claude", "codex", "connector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

# The Facebook source is opt-in and deliberately not a core dependency: it needs
# a real browser engine, which is a different class of dependency from the rest
# of this project. Installed on demand as a separate tool environment — see
# skills/facebook-source/SKILL.md — so a default install stays at two deps.
[project.optional-dependencies]
facebook = [
    "playwright>=1.44",
]

[project.urls]
Homepage = "https://github.com/avshalomd/sporhund"
Repository = "https://github.com/avshalomd/sporhund"
Issues = "https://github.com/avshalomd/sporhund/issues"

[project.scripts]
sporhund = "sporhund.server:main"
# Sidecar for the opt-in Facebook source. Lives in its own process so the
# browser never enters the MCP server's environment, which uvx rebuilds on
# every plugin update and so cannot be installed into after the fact.
sporhund-fb = "sporhund.facebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sporhund"]

# Keep collection inside tests/ so shelved work under archive/ is ignored.
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
