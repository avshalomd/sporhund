[project]
name = "sporhund"
version = "0.1.0"
description = "A FINN.no connector for your AI agent — search, inspect and track Norwegian marketplace listings."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "avshalomd" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
sporhund = "sporhund.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sporhund"]

[dependency-groups]
dev = [
    "pytest>=8",
]
