[project]
name = "finn-agent"
version = "0.1.0"
description = "A private, personal-use MCP server for searching and watching FINN.no listings from an AI agent."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "avshalomd" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
finn-agent = "finn_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn_agent"]

[dependency-groups]
dev = [
    "pytest>=8",
]
